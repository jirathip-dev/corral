name: iOS build (no-op)

# Implements the "skipped-but-required" pattern: this workflow declares a job
# named identically `ios` (matching .github/workflows/ios.yml's job name),
# triggered on the INVERSE path filter. GitHub Actions leaves a required
# check "Pending" forever when the workflow that would produce it is skipped
# by path filtering — see ios.yml's `ios` job, which only runs when the PR
# touches ios/**. Without this no-op twin, requiring `ios` in branch
# protection would permanently block every non-iOS PR. With both workflows
# present, every PR reports exactly one `ios` check: the real build when
# ios/** changed, this instant no-op otherwise. The job name must match
# ios.yml's job name exactly or the pattern does nothing.
on:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "ios/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: ios
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
