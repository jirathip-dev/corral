name: iOS build

on:
  # Dispatch-only since 2026-08: the per-PR macOS job burned 10x-billed
  # minutes on every push, and the billing block (Aug 2026) showed the iOS
  # build+test is a manual gate, not a PR requirement. Trigger it by hand
  # from the Actions tab (or `gh workflow run ios.yml`) when iOS code
  # changes; TestFlight upload is a separate local fastlane lane, never CI.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project (XcodeGen)
        run: xcodegen generate --spec project.yml
        working-directory: ios

      - name: Fail on Xcode project spec drift
        run: git diff --exit-code -- ios/

      # Advisory-first: the vendored package and Package.resolved keep the
      # SwiftSyntax tool reproducible, while the two source paths deliberately
      # exclude generated ios/build/. A non-zero lint run is annotated and
      # allowed through so this adoption does not become an iOS build gate.
      - name: anti-slop Swift lint (advisory)
        continue-on-error: true
        working-directory: ios
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/anti-slop.txt"
          set +e
          swift run --package-path tools/anti-slop-swift anti-slop \
            FleetNotifier FleetNotifierTests 2>&1 | tee "$output"
          lint_status=${PIPESTATUS[0]}
          set -e

          if [ "$lint_status" -eq 0 ]; then
            echo "::notice::anti-slop clean for FleetNotifier and FleetNotifierTests"
            exit 0
          fi

          # Convert the linter's stable file:line:column diagnostics into
          # review-visible warnings. Build/resolution failures still produce
          # the generic advisory below and remain non-blocking by design.
          while IFS=: read -r file line column kind message; do
            [ "$kind" = " error" ] || continue
            case "$file" in
              FleetNotifier/*|FleetNotifierTests/*) ;;
              *) continue ;;
            esac
            message="${message# }"
            rule="${message#\[}"
            rule="${rule%%\]*}"
            detail="${message#*\] }"
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\r'/'%0D'}"
            detail="${detail//$'\n'/'%0A'}"
            echo "::warning file=ios/$file,line=$line,col=$column,title=anti-slop/$rule::$detail"
          done < <(grep -E '^(FleetNotifier|FleetNotifierTests)/' "$output" | grep -E ':[0-9]+:[0-9]+: error: \[[^]]+\] ' || true)

          echo "::warning::anti-slop exited $lint_status; findings are advisory until the baseline is retired"
          exit "$lint_status"

      # Resolve a concrete simulator by UDID instead of hardcoding a device
      # name. The first run of this job failed with exit 70: it asked for
      # `name=iPhone 16` while the macos-latest image (Xcode 26.6) had moved
      # on to the iPhone 17 family, so the destination matched nothing. A
      # UDID is maximally concrete and survives image bumps instead of
      # breaking on the next one.
      - name: Select an available iOS simulator
        id: sim
        run: |
          set -euo pipefail
          # jq rather than an inline python heredoc: every line here must stay
          # indented inside this YAML block scalar, and python is
          # indentation-sensitive, so a python one-liner would have to be
          # unreadable to be correct.
          udid="$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("iOS"))
              | .value[] | select(.isAvailable) ] as $all
            | [ $all[] | select(.name | startswith("iPhone")) ] as $iphones
            | (if ($iphones | length) > 0 then $iphones else $all end)
            | sort_by(.name) | .[0].udid // empty
          ')"
          if [ -z "$udid" ]; then
            echo "::error::no available iOS simulator on this runner image"
            xcrun simctl list devices available
            exit 1
          fi
          name="$(xcrun simctl list devices available | grep "$udid" | head -1 | sed 's/^ *//' || true)"
          echo "Selected simulator: $name"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test (concrete simulator destination)
        run: |
          xcodebuild test \
            -project FleetNotifier.xcodeproj \
            -scheme FleetNotifier \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ios
