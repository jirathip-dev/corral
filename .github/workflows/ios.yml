name: iOS build

on:
  # Dispatch-only since 2026-08: the per-PR macOS job burned 10x-billed
  # minutes on every push, and the billing block (Aug 2026) showed the iOS
  # build+test is a manual gate, not a PR requirement. It does not run
  # automatically on PRs; the orchestrator can dispatch a final branch SHA
  # with `gh workflow run ios.yml --ref <branch>`. TestFlight upload is a
  # separate local fastlane lane, never CI.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project (XcodeGen)
        run: xcodegen generate --spec project.yml
        working-directory: ios

      - name: Fail on Xcode project spec drift
        run: git diff --exit-code -- ios/

      # Advisory-first: the vendored package and Package.resolved keep the
      # SwiftSyntax tool reproducible, while the two source paths deliberately
      # exclude generated ios/build/. This workflow is manual-dispatch-only to
      # preserve the deliberate macOS cost policy. A non-zero lint run is
      # annotated and summarized, then allowed through so this adoption does
      # not become an iOS build gate.
      - name: anti-slop Swift lint (advisory)
        continue-on-error: true
        working-directory: ios
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/anti-slop.txt"
          summary="$GITHUB_STEP_SUMMARY"
          set +e
          swift run --package-path tools/anti-slop-swift anti-slop \
            FleetNotifier FleetNotifierTests 2>&1 | tee "$output"
          lint_status=${PIPESTATUS[0]}
          set -e

          diagnostic_count="$(grep -Ec '^(FleetNotifier|FleetNotifierTests)/.*:[0-9]+:[0-9]+: error: \[[^]]+\] ' "$output" || true)"

          # GitHub renders at most ten annotations from one step. Keep the
          # complete raw output in the job log and in the step summary, with
          # HTML-sensitive bytes escaped so multiline diagnostics remain
          # readable and durable even when the annotation UI is capped.
          write_summary() {
            {
              printf '%s\n' '### anti-slop Swift lint (advisory)' '' \
                "Result: linter exit $lint_status; $diagnostic_count diagnostic starts." \
                'This workflow is manual-dispatch-only. GitHub may render at most 10 warning annotations per step; the complete escaped output below and the job log are the source of truth.' '' \
                '<details><summary>Complete raw linter output</summary>' '' '<pre>'
              sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g' \
                "$output"
              printf '%s\n' '</pre>' '</details>'
            } >> "$summary"
          }
          write_summary

          if [ "$lint_status" -eq 0 ]; then
            echo "::notice::anti-slop clean for FleetNotifier and FleetNotifierTests"
            exit 0
          fi

          # Convert diagnostics into review-visible warnings. Accumulate each
          # diagnostic through the next diagnostic or the linter summary so a
          # reachable multiline message is encoded rather than truncated.
          is_diagnostic_start() {
            case "$1" in
              FleetNotifier/*|FleetNotifierTests/*)
                [[ "$1" =~ :[0-9]+:[0-9]+:\ error:\ \[[^]]+\]\  ]]
                ;;
              *) return 1 ;;
            esac
          }

          emit_annotation() {
            local diagnostic="$1"
            local first_line file line column kind message rule detail continuation
            first_line="${diagnostic%%$'\n'*}"
            IFS=: read -r file line column kind message <<< "$first_line"
            [ "$kind" = " error" ] || return 0
            message="${message# }"
            rule="${message#\[}"
            rule="${rule%%\]*}"
            detail="${message#*\] }"
            if [[ "$diagnostic" == *$'\n'* ]]; then
              continuation="${diagnostic#*$'\n'}"
              detail="${detail}"$'\n'"${continuation}"
            fi
            detail="${detail//%/%25}"
            detail="${detail//$'\r'/%0D}"
            detail="${detail//$'\n'/%0A}"
            printf '::warning file=ios/%s,line=%s,col=%s,title=anti-slop/%s::%s\n' \
              "$file" "$line" "$column" "$rule" "$detail"
          }

          diagnostic=""
          while IFS= read -r raw_line || [ -n "$raw_line" ]; do
            if is_diagnostic_start "$raw_line"; then
              if [ -n "$diagnostic" ]; then
                emit_annotation "$diagnostic"
              fi
              diagnostic="$raw_line"
            elif [[ "$raw_line" == "[anti-slop]"* ]]; then
              if [ -n "$diagnostic" ]; then
                emit_annotation "$diagnostic"
                diagnostic=""
              fi
            elif [ -n "$diagnostic" ]; then
              diagnostic="${diagnostic}"$'\n'"${raw_line}"
            fi
          done < "$output"
          if [ -n "$diagnostic" ]; then
            emit_annotation "$diagnostic"
          fi

          echo "::warning::anti-slop exited $lint_status; findings are advisory until the baseline is retired"
          exit "$lint_status"

      # Resolve a concrete simulator by UDID instead of hardcoding a device
      # name. The first run of this job failed with exit 70: it asked for
      # `name=iPhone 16` while the macos-latest image (Xcode 26.6) had moved
      # on to the iPhone 17 family, so the destination matched nothing. A
      # UDID is maximally concrete and survives image bumps instead of
      # breaking on the next one.
      - name: Select an available iOS simulator
        id: sim
        run: |
          set -euo pipefail
          # jq rather than an inline python heredoc: every line here must stay
          # indented inside this YAML block scalar, and python is
          # indentation-sensitive, so a python one-liner would have to be
          # unreadable to be correct.
          udid="$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("iOS"))
              | .value[] | select(.isAvailable) ] as $all
            | [ $all[] | select(.name | startswith("iPhone")) ] as $iphones
            | (if ($iphones | length) > 0 then $iphones else $all end)
            | sort_by(.name) | .[0].udid // empty
          ')"
          if [ -z "$udid" ]; then
            echo "::error::no available iOS simulator on this runner image"
            xcrun simctl list devices available
            exit 1
          fi
          name="$(xcrun simctl list devices available | grep "$udid" | head -1 | sed 's/^ *//' || true)"
          echo "Selected simulator: $name"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test (concrete simulator destination)
        run: |
          xcodebuild test \
            -project FleetNotifier.xcodeproj \
            -scheme FleetNotifier \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ios
