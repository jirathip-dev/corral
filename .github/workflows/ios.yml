name: iOS build

on:
  # No path filter here — see the `changes` job below. A workflow skipped by
  # PATH FILTERING never reports a check at all, which is what made `ios`
  # unrequireable (a required check that never reports blocks every PR
  # forever). A JOB skipped by an `if:` condition still reports — as a
  # passing "skipped" conclusion, which satisfies a required check — so the
  # path gate has to live inside the job, not the trigger.
  pull_request:
    branches: ["**"]
  # Manual trigger for operators to verify the gate without opening a PR
  # (the branch-under-test need not touch ios/ for a dispatch). Inert until
  # this workflow file lands on main — workflow_dispatch only fires for
  # workflow definitions GitHub has indexed off the default branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap 1x-billed job that decides whether the 10x-billed macOS job below
  # needs to run. Only meaningful for pull_request, where there's a base to
  # diff against; workflow_dispatch has no such base and is a deliberate
  # manual "build it anyway" request, so this job doesn't even run for it
  # (see the `ios` job's `if:`, which short-circuits around this job's
  # output for any non-pull_request event).
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'

  ios:
    name: ios
    needs: [changes]
    # !cancelled() overrides the implicit "needs jobs must succeed" default
    # (which would otherwise skip this job whenever `changes` itself was
    # skipped, i.e. every non-pull_request run) without also forcing the job
    # to run on a genuinely cancelled workflow run — always() would do that,
    # which defeats cancel-in-progress on the only 10x-billed job here and
    # lets a cancelled run report a passing skipped ios.
    #
    # `needs.changes.result != 'success'` is the fail-*closed* half: if
    # `changes` errors (a transient paths-filter API blip, a runner issue)
    # its output is never set, so `needs.changes.outputs.ios == 'true'`
    # alone would be false and ios would silently skip — reporting as a
    # passing required check while a real ios/** change goes unbuilt. A
    # filter that can't decide must fail toward running the expensive job,
    # not skipping it.
    if: |
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.ios == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project (XcodeGen)
        run: xcodegen generate --spec project.yml
        working-directory: ios

      - name: Fail on Xcode project spec drift
        run: git diff --exit-code -- ios/

      # Resolve a concrete simulator by UDID instead of hardcoding a device
      # name. The first run of this job failed with exit 70: it asked for
      # `name=iPhone 16` while the macos-latest image (Xcode 26.6) had moved
      # on to the iPhone 17 family, so the destination matched nothing. A
      # UDID is maximally concrete and survives image bumps instead of
      # breaking on the next one.
      - name: Select an available iOS simulator
        id: sim
        run: |
          set -euo pipefail
          # jq rather than an inline python heredoc: every line here must stay
          # indented inside this YAML block scalar, and python is
          # indentation-sensitive, so a python one-liner would have to be
          # unreadable to be correct.
          udid="$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("iOS"))
              | .value[] | select(.isAvailable) ] as $all
            | [ $all[] | select(.name | startswith("iPhone")) ] as $iphones
            | (if ($iphones | length) > 0 then $iphones else $all end)
            | sort_by(.name) | .[0].udid // empty
          ')"
          if [ -z "$udid" ]; then
            echo "::error::no available iOS simulator on this runner image"
            xcrun simctl list devices available
            exit 1
          fi
          name="$(xcrun simctl list devices available | grep "$udid" | head -1 | sed 's/^ *//' || true)"
          echo "Selected simulator: $name"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test (concrete simulator destination)
        run: |
          xcodebuild test \
            -project FleetNotifier.xcodeproj \
            -scheme FleetNotifier \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ios
