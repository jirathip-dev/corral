name: Linux installer gate

# Linux/systemd release surface (#402): every push and PR runs the hermetic
# installer suite (fake $HOME, stubbed systemctl/curl/uname, file:// release
# fixtures — no root, no systemd needed) and a real loopback daemon smoke of
# the Linux x86_64 release binary. The release-tag workflow builds the
# checksummed Linux artifact; this workflow is the PR-time gate that keeps
# scripts/install-corral.sh and scripts/setup-corrald-linux.sh honest between
# releases. Runs in ~2-4 min (one cargo build --release for the smoke).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-gate:
    name: installer suite + daemon smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same single-source parse as rust.yml: rust-toolchain.toml owns the
      # pinned version and dtolnay/rust-toolchain does not read it itself.
      - name: Read pinned toolchain
        id: pinned
        run: |
          set -euo pipefail
          channel="$(awk '
            /^[[:space:]]*\[toolchain\][[:space:]]*$/ { in_tc = 1; next }
            /^[[:space:]]*\[/                         { in_tc = 0 }
            in_tc && /^[[:space:]]*channel[[:space:]]*=/ {
              if (match($0, /"[^"]*"/) || match($0, /'"'"'[^'"'"']*'"'"'/)) {
                print substr($0, RSTART + 1, RLENGTH - 2)
                exit
              }
            }
          ' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "::error::could not parse a channel from [toolchain] in rust-toolchain.toml"
            exit 1
          fi
          echo "Pinned toolchain: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.pinned.outputs.channel }}

      # libkeyutils-dev is needed by the keyring linux-keyutils store (same
      # dependency rust.yml installs for the workspace build/link). systemd
      # provides systemd-analyze for unit-file verification.
      - name: Install Linux system deps (keyring + systemd-analyze)
        run: |
          sudo apt-get update
          sudo apt-get install -y libkeyutils-dev systemd

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Shell syntax + hermetic installer suite
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f"
          done
          echo "bash -n: all scripts OK"
          # G4 scenarios: fresh install, idempotent reinstall/update, checksum
          # failure, unhealthy service + rollback, uninstall-with-config-
          # preserved, no-root/home-path refusals. On ubuntu systemd-analyze
          # exists, so the suite also runs `systemd-analyze verify` on the
          # generated unit file.
          bash scripts/test-install-corral-linux.sh

      - name: Build release binary (Linux x86_64)
        run: |
          set -euo pipefail
          cargo build --release
          test -x target/release/corrald
          test "$(head -c 4 target/release/corrald)" = "$(printf '\177ELF')"
          file target/release/corrald | grep -q 'x86-64'

      - name: Daemon smoke test (loopback healthz)
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/corral-smoke-home"
          mkdir -p "$home" "$home/.herdr/worktrees"
          port=18474
          HOME="$home" \
          CORRAL_CONFIG_DIR="$home/.config/corral" \
          CORRAL_REPO_ROOT="$home/worktrees" \
          CORRAL_WORKTREES_ROOT="$home/.herdr/worktrees" \
            ./target/release/corrald \
            --socket "$home/.config/herdr/herdr.sock" \
            --bind 127.0.0.1 --port "$port" \
            >"$home/corrald-smoke.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$port/healthz" 2>/dev/null | grep -q ok; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::corrald smoke test failed: healthz never OK on 127.0.0.1:$port"
            cat "$home/corrald-smoke.log"
            exit 1
          fi
          echo "daemon smoke OK: loopback healthz answered on 127.0.0.1:$port"
