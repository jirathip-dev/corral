name: Rust workspace

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `rust-toolchain.toml` is the single source of truth for the version
      # (#48), but dtolnay/rust-toolchain does NOT read it — omitting the
      # input fails the run with "'toolchain' is a required input". So the
      # channel is parsed out of the file and handed to the action, which
      # keeps ONE version in the repo and stops CI drifting from a local
      # checkout. Do not hardcode a version below; edit the toml.
      - name: Read pinned toolchain
        id: pinned
        run: |
          set -euo pipefail
          # Table-aware on purpose: only `channel` INSIDE [toolchain] counts.
          # A plain grep would take a `channel` key from any earlier table and
          # pin the wrong version silently — the emptiness guard below cannot
          # catch a wrong-but-non-empty parse. Accepts TOML basic ("") and
          # literal ('') strings; anything else falls through to the guard and
          # fails the run loudly rather than guessing.
          channel="$(awk '
            /^[[:space:]]*\[toolchain\][[:space:]]*$/ { in_tc = 1; next }
            /^[[:space:]]*\[/                         { in_tc = 0 }
            in_tc && /^[[:space:]]*channel[[:space:]]*=/ {
              if (match($0, /"[^"]*"/) || match($0, /'"'"'[^'"'"']*'"'"'/)) {
                print substr($0, RSTART + 1, RLENGTH - 2)
                exit
              }
            }
          ' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "::error::could not parse a channel from [toolchain] in rust-toolchain.toml"
            exit 1
          fi
          echo "Pinned toolchain: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.pinned.outputs.channel }}
          # cargo-llvm-cov v0.8.7 uses llvm-tools-preview from this exact
          # pinned toolchain; keeping it here avoids a floating LLVM install.
          components: rustfmt, clippy, llvm-tools-preview

      # Formatting is checked FIRST, before the apt install and the cache
      # restore, because `cargo fmt` needs only the toolchain — no system
      # libraries, no cached artifacts. Ordering it here means a formatting
      # slip fails in seconds rather than after ~a minute of installing a
      # wayland/x11/GL stack this path never uses (#51). Blocking as of #40:
      # the tree was reformatted in one mechanical commit, so the gate can
      # hold the line.
      - name: cargo fmt --check
        run: cargo fmt --check

      # Install checksum-verified release binaries after selecting the pinned
      # Rust toolchain. `fallback: none` prevents an unexpected source build.
      # The action itself is SHA-pinned and can be maintained by Dependabot;
      # the explicit cargo-llvm-cov@0.8.7 tool pin is not Dependabot-managed
      # and must be updated manually with a deliberate baseline/toolchain
      # check.
      - name: Install Rust CLI gates
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny,cargo-audit,cargo-llvm-cov@0.8.7
          fallback: none

      - name: cargo deny --locked --workspace check
        run: cargo deny --locked --workspace check

      - name: cargo audit --deny warnings
        run: cargo audit --deny warnings

      # clients/egui (eframe 0.36, wgpu + wayland + x11) builds on Linux with
      # the wayland/x11/GL system packages below. Keeping all three workspace
      # members in this single 1x-billed Ubuntu job is far cheaper than a
      # second 10x-billed macOS job just for the UI crate; the same crate also
      # builds on macOS via the darwin runners used for the iOS job, so a Linux
      # failure here is caught on the hosted runner, not in a local worktree.
      # libkeyutils-dev is needed by the keyring linux-keyutils store used by
      # corrald and corrald-ui.
      - name: Install Linux system deps for egui/wgpu (and keyring)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libkeyutils-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build (release)
        run: cargo build --release

      - name: test
        run: cargo test

      # Keep coverage in this job so it reuses the pinned toolchain, Linux
      # dependencies, cache, and supply-chain gates above. The instrumented
      # build is necessarily separate from the ordinary test build, but the
      # report steps below reuse its profiles and do not compile or rerun tests.
      # The scope is the pure-Rust daemon and client; egui/wgpu platform code
      # remains outside this deterministic core gate (see docs/DEVELOPING.md).
      - name: cargo llvm-cov core coverage gate
        id: coverage
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo llvm-cov clean --locked --workspace
          cargo llvm-cov \
            --locked \
            --package corrald \
            --package corrald-client \
            --all-targets \
            --no-fail-fast \
            --quiet \
            --fail-under-lines 85 \
            --fail-under-functions 82

      # The core gate evaluates thresholds after producing profiles. Generate
      # reports only when that step actually ran, including a threshold
      # failure, and never after cancellation. A pre-profile failure leaves
      # this step failed and therefore cannot publish an artifact.
      - name: Generate Rust coverage reports
        id: coverage_reports
        if: ${{ always() && !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          mkdir -p target
          stage="$(mktemp -d target/.rust-core-coverage.XXXXXX)"
          cleanup() {
            if [ -n "${stage:-}" ] && [ -d "$stage" ]; then
              rm -rf -- "$stage"
            fi
          }
          trap cleanup EXIT

          cargo llvm-cov report \
            --locked \
            --package corrald \
            --package corrald-client \
            > "$stage/rust-core-summary.txt"
          cargo llvm-cov report \
            --locked \
            --package corrald \
            --package corrald-client \
            --json \
            --summary-only \
            --output-path "$stage/rust-core-summary.json"
          cargo llvm-cov report \
            --locked \
            --package corrald \
            --package corrald-client \
            --lcov \
            --output-path "$stage/rust-core.lcov"
          cargo llvm-cov report \
            --locked \
            --package corrald-client \
            > "$stage/rust-client-summary.txt"
          cargo llvm-cov report \
            --locked \
            --package corrald-client \
            --json \
            --summary-only \
            --output-path "$stage/rust-client-summary.json"
          cargo llvm-cov report \
            --locked \
            --package corrald-client \
            --lcov \
            --output-path "$stage/rust-client.lcov"

          for report in \
            rust-core-summary.txt \
            rust-core-summary.json \
            rust-core.lcov \
            rust-client-summary.txt \
            rust-client-summary.json \
            rust-client.lcov
          do
            test -s "$stage/$report"
          done

          # No-profile llvm-cov reports can still be non-empty JSON with an
          # empty file list and zero totals. Require real files and positive
          # coverage in both scopes, plus line records in both LCOV reports,
          # before allowing the staged directory to become uploadable.
          for summary in rust-core-summary.json rust-client-summary.json
          do
            grep -Eq '"files":[[:space:]]*\[[[:space:]]*\{' "$stage/$summary"
            grep -Eq '"lines":\{"count":[1-9][0-9]*,"covered":[1-9][0-9]*' "$stage/$summary"
          done
          grep -q '^SF:' "$stage/rust-core.lcov"
          grep -q '^SF:' "$stage/rust-client.lcov"

          rm -rf -- target/coverage
          mv "$stage" target/coverage
          stage=

      # This is deliberately report-only: it reuses the profiles from the
      # combined gate above and does not rerun corrald-client tests. A client
      # threshold failure must still allow the diagnostic artifact to upload.
      - name: cargo llvm-cov corrald-client coverage gate
        id: client_coverage
        if: ${{ always() && !cancelled() && steps.coverage_reports.outcome == 'success' }}
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo llvm-cov report \
            --locked \
            --package corrald-client \
            --fail-under-lines 40 \
            --fail-under-functions 35

      # Key off report success rather than threshold success: valid profiles
      # from either threshold failure remain useful diagnostics. Missing or
      # empty reports fail the report step, and cancellation suppresses upload.
      - name: Upload Rust coverage artifact
        if: ${{ always() && !cancelled() && steps.coverage_reports.outcome == 'success' && (steps.client_coverage.outcome == 'success' || steps.client_coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-core-coverage
          path: target/coverage
          if-no-files-found: error
          retention-days: 14
