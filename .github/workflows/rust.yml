name: Rust workspace

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No `toolchain:` or `components:` input on purpose (#48): with both
      # omitted, the action installs what `rust-toolchain.toml` pins, so the
      # repo has exactly ONE toolchain version and CI cannot drift from a
      # local checkout. Re-adding an input here would silently override the
      # file and reintroduce the drift this closes.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master

      # clients/egui (eframe 0.36, wgpu + wayland + x11) builds on Linux with
      # the wayland/x11/GL system packages below. Keeping all three workspace
      # members in this single 1x-billed Ubuntu job is far cheaper than a
      # second 10x-billed macOS job just for the UI crate; the same crate also
      # builds on macOS via the darwin runners used for the iOS job, so a Linux
      # failure here is caught on the hosted runner, not in a local worktree.
      # libkeyutils-dev is needed by the keyring linux-keyutils store used by
      # corrald and corrald-ui.
      - name: Install Linux system deps for egui/wgpu (and keyring)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libkeyutils-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # Blocking as of #40. It was report-only while the tree carried ~613
      # pre-existing diff sites; that debt was cleared in one mechanical
      # `cargo fmt` commit in this PR, so the gate can now hold the line.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build (release)
        run: cargo build --release

      - name: test
        run: cargo test
