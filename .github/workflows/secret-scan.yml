name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full tree + diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base SHA and push "before" SHA are local
          # and the diff scan never depends on the event payload alone.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: gitleaks — full tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code=1

      # Scan only files that changed vs the event base AND still exist in the
      # working tree. Scanning git history would keep the g26/apns-push leak
      # permanently red (it lives in history even after untracking); scanning
      # the tree diff matches what a reviewer would actually see.
      - name: gitleaks — diff vs base
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA=""
          fi
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD | while IFS= read -r f; do
              if [ -f "$f" ]; then
                gitleaks dir "$f" --config .gitleaks.toml --redact --no-banner --exit-code=1
              fi
            done
            echo "diff scan clean"
          else
            echo "No base SHA for this event (new-branch push); full-tree scan above is the gate."
          fi

  tracked-secrets:
    name: tracked secret files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Index-based check. Comments and .gitignore claims lie (the #36 leak
      # shipped a fastlane/.env whose own first line claimed it was gitignored
      # while git ls-tree showed it tracked); the git index is the truth.
      - name: Check tracked secret files (git ls-tree)
        run: |
          set -euo pipefail
          bad="$(git ls-tree -r HEAD --name-only | awk '
            {
              n = split($0, parts, "/")
              base = parts[n]
              if (base == ".env") { print; next }
              if (base ~ /\.(p8|p12|mobileprovision|cer)$/) { print }
            }
          ')"

          if [ -n "$bad" ]; then
            echo "::error::Tracked secret files found via git ls-tree -r HEAD:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "No tracked secret files (.env / *.p8 / *.p12 / *.mobileprovision / *.cer)."