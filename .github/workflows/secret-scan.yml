name: Secret scan

on:
  # #39 scope: "Secret scanning (all pushes and PRs)" — unlike rust.yml
  # (16 min, worth capping to main), this job is 8-13s. Running it twice on
  # a branch with an open PR costs ~1 billed minute; narrowing it to
  # push:[main] instead would mean feature-branch pushes with no open PR
  # get no scan at all, which is the actual #39 requirement.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Verify ASC allowlist keeps same-line secrets visible
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/.github/workflows"
          cp .gitleaks.toml "$fixture/.gitleaks.toml"
          git -C "$fixture" init --quiet

          asc_key_name='ASC_KEY_ID'
          asc_key_ref="\$ASC_KEY_ID"
          printf 'echo "%s=%s"\n' "$asc_key_name" "$asc_key_ref" > "$fixture/.github/workflows/ios-testflight.yml"
          (
            cd "$fixture"
            gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code=1
          )

          printf 'echo "%s=%s"; echo "APPENDED_TEST_SECRET"\n' "$asc_key_name" "$asc_key_ref" > "$fixture/.github/workflows/ios-testflight.yml"
          if (
            cd "$fixture"
            gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code=1
          ); then
            echo "::error::same-line secret concatenation was suppressed by the ASC allowlist."
            exit 1
          fi
          echo "ASC allowlist regression check passed: same-line concatenation is detected."

          # Start the README regression from the clean placeholder again so
          # its positive case is independent of the ASC negative case above.
          printf 'echo "%s=%s"\n' "$asc_key_name" "$asc_key_ref" > "$fixture/.github/workflows/ios-testflight.yml"
          mkdir -p "$fixture/ios/tools/anti-slop-swift"
          fake_key_prefix='sk-live-'
          fake_key_suffix='abc123'
          printf 'let apiKey = "%s%s"\n' "$fake_key_prefix" "$fake_key_suffix" \
            > "$fixture/ios/tools/anti-slop-swift/README.md"
          (
            cd "$fixture"
            gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code=1
          )

          changed_part_a='1234567890'
          changed_part_b='abcdef'
          changed_part_c='1234567890'
          changed_value="${changed_part_a}${changed_part_b}${changed_part_c}"
          printf 'let apiKey = "%s%s"\n' "$fake_key_prefix" "$changed_value" \
            > "$fixture/ios/tools/anti-slop-swift/README.md"
          if (
            cd "$fixture"
            gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code=1
          ); then
            echo "::error::the scoped anti-slop README allowlist suppressed a changed same-line API key."
            exit 1
          fi
          echo "anti-slop README allowlist regression check passed: only the exact upstream example is suppressed."

      # This is the content gate: gitleaks scans the whole checked-out tree.
      # There is deliberately no separate "diff vs base" step — under
      # squash-merge (the assumption here), the tree scan already covers
      # everything a diff scan would, so a second step would be a strict
      # subset scan that can never fail independently. The genuinely
      # independent second check is `tracked-secrets` below, which works off
      # the git index instead of file content. Scanning git history is also
      # deliberately not done: `gitleaks git` would keep g26/apns-push
      # permanently red for a leak that already lives in its history.
      - name: gitleaks — full tree
        run: gitleaks dir . --config .gitleaks.toml --redact -v --no-banner --exit-code=1

  tracked-secrets:
    name: tracked secret files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Index-based check. Comments and .gitignore claims lie (the #36 leak
      # shipped a fastlane/.env whose own first line claimed it was gitignored
      # while git ls-tree showed it tracked); the git index is the truth.
      # `-c core.quotePath=false` disables the default C-quoting of
      # non-ASCII paths, which otherwise wraps the path in `"..."` and
      # silently breaks both the basename equality and the extension anchor.
      - name: Check tracked secret files (git ls-tree)
        run: |
          set -euo pipefail
          bad="$(git -c core.quotePath=false ls-tree -r HEAD --name-only | awk '
            {
              n = split($0, parts, "/")
              base = tolower(parts[n])
              if (base ~ /\.example$/) next
              if (base == ".env") { print; next }
              if (base ~ /^\.env\./) { print; next }
              if (base ~ /\.env$/) { print; next }
              if (base ~ /\.(p8|p12|mobileprovision|cer|key|crt)$/) { print }
            }
          ')"

          if [ -n "$bad" ]; then
            echo "::error::Tracked secret files found via git ls-tree -r HEAD:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "No tracked secret files (.env / .env.* / *.env / *.p8 / *.p12 / *.mobileprovision / *.cer / *.key / *.crt)."
