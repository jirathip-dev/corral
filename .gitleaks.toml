title = "Corral secret-scan config"

[extend]
useDefault = true

# Default rules do not cover Fastlane's ASC env vars (the #36 leak:
# ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_PATH in fastlane/.env). Flag them.
#
# `[^\S\r\n]` (horizontal whitespace) rather than `\s`, which also matches
# newlines: with `\s*` an EMPTY placeholder like `ASC_KEY_ID=` swallowed the
# line break and matched the *next* line's variable name, so this rule fired
# on fastlane/.env.example — the documented empty-value contract — and
# reported the wrong line. A credential must now appear on the same line as
# its key. The capture group is the VALUE, so --redact masks the secret
# rather than the variable name.
[[rules]]
id = "fastlane-asc-credentials"
description = "Fastlane App Store Connect API credentials"
regex = '''(?i)ASC_(?:KEY_ID|ISSUER_ID|KEY_PATH)[^\S\r\n]*=[^\S\r\n]*(\S+)'''
secretGroup = 1
tags = ["fastlane", "app-store-connect"]

# These GitHub Actions GITHUB_ENV writes declare environment-variable names
# only; their values are shell variable references supplied by repo secrets
# (e.g. `$key_path`, `$ASC_KEY_ID`), never literal credential material. The
# allowlist is scoped to this file and to these exact assignments so a real
# secret on any of these lines remains reportable.
[[rules.allowlists]]
description = "GITHUB_ENV writes declare ASC variable names, not secret values"
condition = "AND"
paths = ['''^\.github/workflows/ios-testflight\.yml$''']
regexTarget = "line"
regexes = [
  '''^\s*echo "ASC_(?:KEY_PATH=\$key_path|KEY_ID=\$ASC_KEY_ID|ISSUER_ID=\$ASC_ISSUER_ID)"\s*$''',
]

# The upstream v0.1.7 README intentionally demonstrates this rule with a
# fake API-key-shaped value. Keep the snapshot byte-exact, but scope the
# exception to that one path and exact source line. A changed value remains
# visible to the default generic-api-key rule; secret-scan regression coverage
# below exercises that boundary.
# Target the extended default `generic-api-key` rule rather than the custom
# Fastlane rule above; a targeted allowlist is evaluated with the finding and
# does not make the source walker skip this path before checking the line.
[[allowlists]]
description = "Upstream anti-slop README fake API-key example"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^ios/tools/anti-slop-swift/README\.md$''']
regexTarget = "line"
regexes = [
  '''^\s*let apiKey = "sk-live-abc123"\s*$''',
]
