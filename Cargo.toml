[package]
name = "corrald"
version = "0.1.0"
edition = "2024"
description = "Corral host daemon: tool-agnostic agent-fleet control plane (P1: canonical agent model + herdr adapter + snapshot/SSE)"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "3", default-features = true }
futures = "0.3"
getrandom = "0.4"
notify = "8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
