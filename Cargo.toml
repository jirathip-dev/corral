[workspace]
# Additive-only: corrald's package stays untouched; new crates go under crates/.
# default-members keeps the mandated root gate (build/clippy/test) covering
# BOTH crates: at a non-virtual workspace root, cargo would otherwise
# operate on the root package only and silently skip corrald-client.
resolver = "3"
members = ["crates/corrald-client", "clients/egui"]
default-members = [".", "crates/corrald-client", "clients/egui"]

[package]
name = "corrald"
version = "0.1.0"
edition = "2024"
description = "Corral host daemon: tool-agnostic agent-fleet control plane (P1: canonical agent model + herdr adapter + snapshot/SSE)"
license = "MIT OR Apache-2.0"

[features]
# Test/signing helpers for the integration test suite and the live
# self-test client. Never enabled in production builds: the release binary
# must not expose secret accessors on the lib surface.
test-utils = []

[dependencies]
axum = "0.8"
base64 = "0.23"
chrono = "0.4"
ed25519-dalek = { version = "3", default-features = true }
futures = "0.3"
getrandom = "0.4"
# #232: worktree diffs are computed through libgit2 (vendored) — local
# repository diff only, no network/ssh features. Never a git subprocess.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
keyring = { version = "4.1.6", default-features = false, features = ["apple-native-keyring-store", "linux-keyutils-keyring-store", "v1"] }
notify = "8"
# http2: APNs requires HTTP/2 (D16 push notifier). json: drive/read paths.
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
reqwest = { version = "0.13", features = ["json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
zeroize = "1"

[dev-dependencies]
corrald = { path = ".", features = ["test-utils"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
