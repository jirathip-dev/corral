[package]
name = "corrald"
version = "0.1.0"
edition = "2024"
description = "Corral host daemon: tool-agnostic agent-fleet control plane (P1: canonical agent model + herdr adapter + snapshot/SSE)"
license = "MIT"

[dependencies]
axum = "0.8"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
