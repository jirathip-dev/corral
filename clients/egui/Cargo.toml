[package]
name = "corrald-ui"
version = "0.1.0"
edition = "2024"
description = "Corral P4 desktop client: dark-dashboard fleet board speaking corrald's signed drive plane (eframe/wgpu, macOS + Linux)"
license = "MIT"

[lib]
# cdylib: wasm-pack (the #215 web build) emits the wasm artifact from the
# lib crate — its `#[wasm_bindgen(start)]` hook in lib.rs is the web
# entrypoint. rlib: the native bin + test binaries keep linking as today.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "3"
base64 = "0.23"
sha2 = "0.11"
getrandom = "0.4"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui = "0.36"
egui_extras = "0.36"

# Native (desktop) renderer/deps. The wasm build replaces eframe's renderer
# with glow/WebGL and drops the platform crates below entirely (#215).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "default-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
keyring = { version = "4.1.6", default-features = false, features = ["v1", "apple-native-keyring-store", "linux-keyutils-keyring-store"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", default-features = false }
libc = "0.2"

# Web (wasm32-unknown-unknown) deps: eframe glow/WebGL, reqwest's fetch
# backend, + wasm-bindgen glue for the eframe WebRunner bootstrap and
# localStorage persistence (#215). `tokio` keeps only the pure-task/sync
# surface the shared protocol module compiles against; the web app drives
# agents with spawn_local (no tokio runtime on wasm).
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Storage"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
axum = "0.8"
corrald = { path = "../..", features = ["test-utils"] }
futures = "0.3"
