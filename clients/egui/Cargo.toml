[package]
name = "corrald-ui"
version = "0.1.0"
edition = "2024"
description = "Corral P4 desktop client: dark-dashboard fleet board speaking corrald's signed drive plane (eframe/wgpu, macOS + Linux)"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui_extras = "0.36"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "default-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "3"
base64 = "0.23"
sha2 = "0.11"
getrandom = "0.4"
zeroize = "1"
keyring = { version = "4.1.6", default-features = false, features = ["v1", "apple-native-keyring-store", "linux-keyutils-keyring-store"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", default-features = false }
libc = "0.2"

[dev-dependencies]
corrald = { path = "../..", features = ["test-utils"] }
