<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>corral fleet — read-only web board</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #15161a;
      }
      /* The canvas is sized by eframe's WebRunner; the body must not scroll. */
      body {
        overflow: hidden;
      }
      #corral {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="corral"></canvas>
    <script type="module">
      import init from "./corral-web.js";
      // Instantiate the wasm; the Rust `main()` boots eframe on the canvas.
      init();
    </script>
  </body>
</html>
