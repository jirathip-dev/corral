id = "fleet-ops"
name = "Fleet Ops (fixture)"
version = "0.1.0"
platforms = ["macos", "linux"]
plugin_schema = "1"

[[cards]]
id = "registry"
title = "Registry"
command = ["printf", "{\"fleets\":3,\"status\":\"ok\"}"]
interval_sec = 60
json = true

[[cards]]
id = "orchestrator"
title = "Orchestrator state"
command = ["printf", "{\"state\":\"running\",\"workers\":3}"]
interval_sec = 60
json = true

[[cards]]
id = "admission"
title = "Admission state"
command = ["printf", "{\"state\":\"open\"}"]
interval_sec = 60
json = true

[[actions]]
id = "refresh"
title = "Refresh"
command = ["printf", "fixture refreshed"]
confirm_message = "Refresh the fleet-ops fixture?"
