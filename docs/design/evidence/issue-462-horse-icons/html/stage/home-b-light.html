<!doctype html><html><head><meta charset="utf-8"><style>:root{--fg:#1c1c1e;
--dock:rgba(245,245,245,.55);}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
 -webkit-font-smoothing:antialiased;position:relative}
.phone{width:390px;height:844px;position:relative;overflow:hidden}
.wall{position:absolute;inset:0}
.status{position:absolute;top:14px;left:0;right:0;height:20px;display:flex;
 justify-content:space-between;align-items:center;padding:0 26px;
 font-size:14px;font-weight:600;color:var(--fg)}
.batt{width:24px;height:11px;border:1px solid var(--fg);border-radius:3px;
 position:relative;opacity:.9}
.batt:after{content:'';position:absolute;inset:1.5px;right:5px;
 background:var(--fg);border-radius:1px}
.sig{letter-spacing:1px;font-size:11px}
.band{position:absolute;top:150px;left:0;right:0;text-align:center;
 color:var(--fg)}
.band h1{font-size:16px;font-weight:700}
.band p{font-size:11px;opacity:.75;margin-top:3px}
.row{position:absolute;top:210px;left:0;right:0;display:flex;
 justify-content:center;gap:9px}
.tile{width:64px;display:flex;flex-direction:column;align-items:center;
 padding-top:4px;padding-bottom:6px;border-radius:12px}
.tile .lbl{font-size:9.5px;margin-top:5px;color:var(--fg);font-weight:500;
 text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap}
.grid{position:absolute;top:318px;left:20px;right:20px;display:grid;
 grid-template-columns:repeat(4,1fr);gap:18px 16px}
.app{display:flex;flex-direction:column;align-items:center}
.app .ic{width:58px;height:58px;border-radius:13px}
.app .lb{font-size:9.5px;margin-top:4px;color:var(--fg);font-weight:500;
 text-shadow:0 1px 2px rgba(0,0,0,.35)}
.dots{position:absolute;bottom:130px;left:0;right:0;display:flex;gap:7px;
justify-content:center}
.dot{width:6px;height:6px;border-radius:3px;background:var(--fg);opacity:.35}
.dot.on{opacity:.9}
.dock{position:absolute;bottom:16px;left:10px;right:10px;height:88px;
 border-radius:26px;background:var(--dock);display:flex;align-items:center;
 justify-content:space-around;padding:0 8px}
.dock .ic{width:58px;height:58px;border-radius:13px}
.proto{position:absolute;bottom:106px;left:0;right:0;text-align:center;
 font-size:8.5px;color:var(--fg);opacity:.55;letter-spacing:.2px}
.wall{background:linear-gradient(180deg,#a7c4dc 0%,#cfd9c8 55%,#e8d9b8 100%)}</style></head><body><div class="phone"><div class="wall"></div><div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><span class="sig">▴▴▶</span><span class="batt"></span></span></div><div class="band"><h1>Treatment B — tight full horse</h1><p>Corral icon choices on this wallpaper</p></div><div class="row"><div class="tile"><img src="../../masters/treatment-b/original-1024.png" alt="" style="width:60px;height:60px;border-radius:14px;display:block"><div class="lbl">Original</div></div><div class="tile"><img src="../../masters/treatment-b/bay-1024.png" alt="" style="width:60px;height:60px;border-radius:14px;display:block"><div class="lbl">Bay</div></div><div class="tile"><img src="../../masters/treatment-b/palomino-1024.png" alt="" style="width:60px;height:60px;border-radius:14px;display:block"><div class="lbl">Palomino</div></div><div class="tile"><img src="../../masters/treatment-b/black-1024.png" alt="" style="width:60px;height:60px;border-radius:14px;display:block"><div class="lbl">Black</div></div><div class="tile"><img src="../../masters/treatment-b/grey-1024.png" alt="" style="width:60px;height:60px;border-radius:14px;display:block"><div class="lbl">Grey</div></div></div><div class="grid"><div class="app"><div class="ic" style="background:#9aa2ad"></div><div class="lb">App 1</div></div><div class="app"><div class="ic" style="background:#8d9688"></div><div class="lb">App 2</div></div><div class="app"><div class="ic" style="background:#a89a8d"></div><div class="lb">App 3</div></div><div class="app"><div class="ic" style="background:#7f8a99"></div><div class="lb">App 4</div></div><div class="app"><div class="ic" style="background:#a3ad98"></div><div class="lb">App 5</div></div><div class="app"><div class="ic" style="background:#98867a"></div><div class="lb">App 6</div></div><div class="app"><div class="ic" style="background:#87909f"></div><div class="lb">App 7</div></div><div class="app"><div class="ic" style="background:#9c948a"></div><div class="lb">App 8</div></div></div><div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div></div><div class="proto">PROTOTYPE — does not change the real app icon</div><div class="dock"><div class="ic" style="background:#b0b6bd"></div><div class="ic" style="background:#9aa78f"></div><div class="ic" style="background:#b8a58c"></div><div class="ic" style="background:#8f9aa8"></div></div></div></body></html>
