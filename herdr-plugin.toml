# Herdr plugin manifest v1 for Corral's control-plane actions.
#
# Commands are argv arrays. Herdr runs them from the linked or installed
# plugin root and supplies the normal HERDR_PLUGIN_* environment.

id = "corral.control-plane"
name = "Corral control plane"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Set up Corral and inspect the live corrald fleet."
platforms = ["macos", "linux"]

[[actions]]
id = "setup"
title = "Set up Corral"
contexts = ["global", "workspace", "tab", "pane"]
command = ["scripts/setup-corrald.sh"]

[[actions]]
id = "status"
title = "Show Corral status"
contexts = ["global", "workspace", "tab", "pane"]
command = ["scripts/corral-status.sh"]
