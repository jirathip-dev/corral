name: FleetNotifier
options:
  bundleIdPrefix: com.corral
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9244PWFYD7
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
targets:
  FleetNotifier:
    type: application
    platform: iOS
    sources:
      - FleetNotifier
      - path: FleetNotifier/Assets.xcassets
        buildPhase: resources
    preBuildScripts:
      - name: Embed Release source attestation
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            python3 "$SRCROOT/embed-release-source-digest.py" \
              --source-root "$SRCROOT/.." \
              --output "$DERIVED_FILE_DIR/corral-release-source-attestation"
          fi
        inputFiles:
          - "$(SRCROOT)/../ios/FleetNotifier"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/corral-release-source-attestation"
        basedOnDependencyAnalysis: false
    info:
      path: FleetNotifier/Info.plist
      properties:
        CFBundleDisplayName: "Corral: Agent Fleet"
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Connects to your corrald daemon on the local network (Tailscale) to show the fleet and send signed commands."
        NSAppTransportSecurity:
          # Deliberately NO ts.net / insecure-HTTP exception (#80): the
          # build-3 carve-out never worked — iOS forces a TLS upgrade on
          # MagicDNS hostnames regardless — and ATS classifies Tailscale's
          # 100.64/10 (CGNAT) as public internet, so NSAllowsLocalNetworking
          # does not cover a tailnet-bound plain-HTTP daemon either. Remote
          # access is real TLS via `tailscale serve` fronting the
          # loopback-bound daemon; see docs/OPERATIONS.md "Remote access
          # from iOS (Tailscale Serve)". NSAllowsLocalNetworking stays for
          # LAN/loopback dev setups.
          NSAllowsLocalNetworking: YES
        NSFaceIDUsageDescription: "Face ID step-up is required before destructive commands are sent to agents."
        NSUserNotificationsUsageDescription: "Corral shows a local notification when an agent blocks, so you can answer from the lock screen."
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corral.fleetnotifier
        PRODUCT_NAME: FleetNotifier
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
      configs:
        Release:
          OTHER_LDFLAGS:
            - "-Xlinker"
            - "-sectcreate"
            - "-Xlinker"
            - "__CORRAL"
            - "-Xlinker"
            - "__source_digest"
            - "-Xlinker"
            - "$(DERIVED_FILE_DIR)/corral-release-source-attestation"
  FleetNotifierTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FleetNotifierTests
    dependencies:
      - target: FleetNotifier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corral.fleetnotifier.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FleetNotifier:
    build:
      targets:
        FleetNotifier: all
        FleetNotifierTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FleetNotifierTests
    archive:
      config: Release
