name: FleetNotifier
options:
  bundleIdPrefix: com.corral
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
targets:
  FleetNotifier:
    type: application
    platform: iOS
    sources:
      - FleetNotifier
    info:
      path: FleetNotifier/Info.plist
      properties:
        CFBundleDisplayName: Corral
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Connects to your corrald daemon on the local network (Tailscale) to show the fleet and send signed commands."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
        NSFaceIDUsageDescription: "Face ID step-up is required before destructive commands are sent to agents."
        NSUserNotificationsUsageDescription: "Corral shows a local notification when an agent blocks, so you can answer from the lock screen."
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corral.fleetnotifier
        PRODUCT_NAME: FleetNotifier
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
  FleetNotifierTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FleetNotifierTests
    dependencies:
      - target: FleetNotifier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corral.fleetnotifier.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FleetNotifier:
    build:
      targets:
        FleetNotifier: all
        FleetNotifierTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FleetNotifierTests
    archive:
      config: Release
